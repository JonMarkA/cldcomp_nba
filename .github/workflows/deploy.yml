name: Deploy NBA Oracle to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v3

      - name: ☁️ Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: 🚀 Upload files to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --destination '$web' \
            --source . \
            --pattern "*.html" \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --overwrite true

          az storage blob upload-batch \
            --destination '$web' \
            --source . \
            --pattern "*.css" \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --overwrite true

          az storage blob upload-batch \
            --destination '$web' \
            --source . \
            --pattern "*.js" \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --overwrite true

          az storage blob upload-batch \
            --destination '$web' \
            --source . \
            --pattern "*.json" \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --overwrite true

      - name: ✅ Done
        run: echo "NBA Oracle deployed successfully!"